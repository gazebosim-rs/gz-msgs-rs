name: schemas
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: python3 tools/test_validate.py
      - run: python3 tools/test_staged.py
      - run: |
          mkdir -p artifacts
          python3 tools/validate.py > artifacts/validation.json
          git archive --format=tar --prefix=gz-msgs-schemas/ HEAD > artifacts/schemas.tar
          sha256sum artifacts/schemas.tar > artifacts/schemas.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemas-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/validation.json
            artifacts/schemas.tar
            artifacts/schemas.tar.sha256
          if-no-files-found: error
