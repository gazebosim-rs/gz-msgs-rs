[package]
name = "gz-msgs"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Canonical Gazebo protobuf messages, reflection, and conversion helpers"
repository = "https://github.com/gazebosim-rs/gz-msgs-rs"
build = "build.rs"

[dependencies]
bytemuck = "=1.25.2"
quick-xml = "=0.38.3"
prost = "=0.14.4"
prost-derive = { path = "vendor/prost-derive-0.14.4", version = "=0.14.4" }
prost-types = "=0.14.4"
prost-reflect = { path = "vendor/prost-reflect-0.16.5", version = "=0.16.5", features = ["serde", "text-format"] }
serde_json = "=1.0.149"

[build-dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
prost-build = "=0.14.4"
heck = "=0.5.0"
serde_json = "=1.0.149"

[profile.dev]
debug = 1

[[test]]
name = "factory_env"
path = "tests/factory_env.rs"
harness = false
