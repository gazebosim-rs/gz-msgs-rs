[package]
name = "gz-msgs"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Canonical Gazebo protobuf messages, reflection, and conversion helpers"
build = "build.rs"

[dependencies]
protobuf = "=3.7.2"
protobuf-json-mapping = "=3.7.2"

[build-dependencies]
protobuf-codegen = "=3.7.2"

[profile.dev]
debug = 1
