syntax = "proto3";
package cli.example;
import "gz/msgs/time.proto";

message Outer {
  message Nested { string data = 1; }
  enum Choice { UNKNOWN = 0; FIRST = 1; }
  map<string, gz.msgs.Time> labels = 1;
  Nested child = 2;
}
